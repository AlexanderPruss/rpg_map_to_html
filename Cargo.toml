[package]
name = "rpg_map_to_html"
version = "1.0.0"
edition = "2024"
description = "Creates html documentation for rpg maps."
license = "MIT"
repository = "https://github.com/AlexanderPruss/rpg_map_to_html"
readme = "Readme.MD"
keywords = ["ttrpg", "rpg", "dnd", "hexmap"]


[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
image = { version = "0.25.10"}
imageproc = { version = "0.27.0" }
ab_glyph = "0.2.32"
pulldown-cmark = "0.13.4"
regex = "1.12.4"
