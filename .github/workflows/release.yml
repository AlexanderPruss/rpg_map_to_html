name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: cargo test --verbose

  create-release:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes

  upload-binaries:
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: myapp

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: myapp.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: myapp

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: myapp

    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/
          tar -C package -czf ${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} package/
          Compress-Archive `
            -Path package/* `
            -DestinationPath "${{ github.event.repository.name }}-${{ matrix.target }}.zip"

      - name: Upload binaries
        shell: bash
        run: |
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            gh release upload "${{ github.ref_name }}" \
              "${{ github.event.repository.name }}-${{ matrix.target }}.zip"
          else
            gh release upload "${{ github.ref_name }}" \
              "${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz"
          fi